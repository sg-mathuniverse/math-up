name: Validate RMU 3.0 pull requests

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build Math Up
        env:
          VITE_APPS_SCRIPT_URL: https://script.google.com/a/macros/genius.sch.id/s/AKfycbwrsYVZ0jSJWCztOKSYDeljsosABihhapv6T95ymmX-fXqq09DVsm-otgg8ilrtpmWGGQ/exec
        run: npm run build
      - name: Verify build output
        run: |
          test -f dist/index.html
          grep -q '/math-up/assets/' dist/index.html
          ! grep -q './src/main.jsx' dist/index.html
