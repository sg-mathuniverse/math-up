name: Deploy Math Up to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Math Up
        env:
          VITE_APPS_SCRIPT_URL: https://script.google.com/a/macros/genius.sch.id/s/AKfycbwrsYVZ0jSJWCztOKSYDeljsosABihhapv6T95ymmX-fXqq09DVsm-otgg8ilrtpmWGGQ/exec
        run: npm run build

      - name: Verify Vite output
        run: |
          test -f dist/index.html
          grep -q '/math-up/assets/' dist/index.html
          ! grep -q './src/main.jsx' dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
