<!doctype html>
<html lang="id">
<head>
  <base target="_top">
  <?!= include('Styles'); ?>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">∑</div><div><strong>Math Up</strong><span>Teacher Workspace</span></div></div>
    <nav id="nav"></nav>
    <div class="sidebar-bottom"><button class="nav" data-page="Pengaturan"><span>⚙</span><span>Pengaturan</span></button></div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="crumb"><span>Workspace</span><b>/</b><strong id="pageName">Dashboard</strong></div><div class="top-actions"><div class="search">⌕<input id="search" placeholder="Cari tugas..."></div><button class="icon-btn" id="refresh" title="Muat ulang">↻</button><div class="profile-wrap"><button class="profile-trigger" id="profileTrigger" aria-haspopup="menu" aria-expanded="false"><span class="avatar" id="avatar">GM</span><span class="profile-chevron">▾</span></button><div class="profile-dropdown" id="profileDropdown" hidden><div class="profile-dropdown-user"><span class="avatar" id="dropdownAvatar">GM</span><div><b id="userName">Memuat...</b><span id="userEmail">...</span></div></div><button data-page="Profil Saya">◉ <span>Profil Saya</span></button><button data-page="Daftar Guru Aktif">♙ <span>Daftar Guru Aktif</span></button></div></div></div></header>
    <div id="content"></div>
  </main>
</div>
<div id="modalRoot"></div>
<script>
const pages=['Dashboard','Jadwal Mengajar','Guru Pengganti','To-Do','Kalender Akademik','Drive Materi','Pengaturan'];
const state={page:'Dashboard',data:{todos:[],schedule:[],allSchedule:[],events:[],teachers:[],activeTeachers:[],academicCalendar:[],substitutions:[],substitutionRequests:[]},user:null,query:'',scheduleDate:''};
const navIcons={'Dashboard':'▦','Jadwal Mengajar':'◷','Guru Pengganti':'⇄','To-Do':'✓','Kalender Akademik':'▦','Drive Materi':'▤'};
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function run(name,args=[]){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(e))[name](...args));}
function renderNav(){document.getElementById('nav').innerHTML=pages.map(p=>'<button class="nav '+(state.page===p?'active':'')+'" data-page="'+p+'"><span>'+ (navIcons[p]||'⚙')+'</span><span>'+p+'</span>'+(p==='To-Do'?'<em>'+state.data.todos.filter(t=>!t.done).length+'</em>':'')+'</button>').join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render();});}
function render(){renderNav();document.getElementById('pageName').textContent=state.page;const c=document.getElementById('content');if(state.page==='Dashboard')c.innerHTML=dashboard();else if(state.page==='To-Do')c.innerHTML=todoPage();else if(state.page==='Jadwal Mengajar')c.innerHTML=schedulePage();else if(state.page==='Guru Pengganti')c.innerHTML=substitutePage();else if(state.page==='Kalender Akademik')c.innerHTML=calendarPage();else if(state.page==='Drive Materi')c.innerHTML=drivePage();else if(state.page==='Profil Saya')c.innerHTML=profilePage();else if(state.page==='Daftar Guru Aktif')c.innerHTML=activeTeachersPage();else c.innerHTML=settingsPage();bind();}
function todoRows(){let q=state.query.toLowerCase();return state.data.todos.filter(t=>String(t.title).toLowerCase().includes(q)).sort((a,b)=>String(a.dueAt).localeCompare(String(b.dueAt))||String(a.priority).localeCompare(String(b.priority))).map(t=>'<div class="todo-row '+(t.done?'done':'')+'"><button class="check" data-toggle="'+esc(t.id)+'">'+(t.done?'✓':'')+'</button><div class="todo-copy"><b>'+esc(t.title)+'</b><span>'+esc(t.description)+'</span><small>◷ '+esc(t.dueAt||'Belum ditentukan')+'</small></div><span class="priority '+String(t.priority).toLowerCase()+'">'+esc(t.priority)+'</span></div>').join('')||'<div class="empty-note">Belum ada tugas.</div>';}
function dashboard(){const active=state.data.todos.filter(t=>!t.done).length;return '<div class="content">'+substituteAlerts()+'<section class="hero"><div><div class="eyebrow">✦ Selamat datang kembali</div><h1>Selamat pagi, Guru! 👋</h1><p>Berikut ringkasan aktivitas matematika Anda.</p></div><button class="primary" id="addTodo">＋ Tambah tugas</button></section><div class="stats"><div class="stat"><div class="stat-icon">▣</div><div><span>Jam mengajar hari ini</span><strong>'+state.data.schedule.length+'</strong><small>Jadwal tersimpan</small></div></div><div class="stat"><div class="stat-icon">✓</div><div><span>Tugas aktif</span><strong>'+active+'</strong><small>Perlu diselesaikan</small></div></div><div class="stat"><div class="stat-icon">□</div><div><span>Agenda akademik</span><strong>'+state.data.events.length+'</strong><small>Agenda bersama</small></div></div></div><div class="grid"><section class="card"><div class="card-head"><div><h2>Jadwal mengajar</h2><p>Data bersama dari Google Sheets</p></div></div><div class="schedule-list">'+scheduleRows()+'</div></section><section class="card"><div class="card-head"><div><h2>To-Do terdekat</h2><p>Deadline lalu prioritas</p></div></div><div class="todo-list">'+todoRows().split('</div>').slice(0,5).join('</div>')+'</div><button class="full-btn" id="addTodo2">＋ Tambah tugas baru</button></section></div></div>';}
function scheduleRows(){return state.data.schedule.slice(0,8).map(s=>'<div class="schedule-row"><div class="time"><b>'+esc(s.startTime)+'</b><span>'+esc(s.endTime)+'</span></div><div class="lesson"><div><b>'+esc(s.className)+'</b><span>'+esc(s.topic)+'</span></div><small>'+esc(s.room)+'</small></div></div>').join('')||'<div class="empty-note">Belum ada jadwal.</div>';}
function todoPage(){return '<div class="content"><section class="page-title"><div><div class="eyebrow">Produktivitas</div><h1>To-Do</h1><p>Kelola pekerjaan mengajar dan deadline.</p></div><button class="primary" id="addTodo">＋ Tambah tugas</button></section><section class="card"><div class="todo-list large">'+todoRows()+'</div></section></div>';}
function schedulePage(){const today=state.scheduleDate||todayForSchedule();const rows=state.data.allSchedule||state.data.schedule;return '<div class="content"><section class="page-title"><div><div class="eyebrow">Kolaborasi</div><h1>Jadwal Mengajar</h1><p>Semua guru matematika dapat melihat jadwal bersama. Pilih tanggal untuk melihat guru pengganti yang berlaku.</p></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input id="scheduleDate" type="date" value="'+today+'" style="border:1px solid #dfe4ea;border-radius:8px;padding:10px"><button class="secondary" id="addSchedule">＋ Tambah jadwal</button><button class="primary" id="openSubstitute">⇄ Cari guru pengganti</button></div></section><section class="card"><div class="card-head"><div><h2>Jadwal bersama</h2><p>Jadwal Anda dan guru matematika lain.</p></div></div><div class="table-wrap"><table><thead><tr><th>Guru</th><th>Hari</th><th>Jam</th><th>Kelas</th><th>Materi</th><th>Ruang</th></tr></thead><tbody>'+rows.slice().sort((a,b)=>String(a.day).localeCompare(String(b.day))||String(a.startTime).localeCompare(String(b.startTime))).map(s=>{const t=state.data.teachers.find(x=>String(x.email).toLowerCase()===String(s.teacherEmail).toLowerCase());const isReplacement=s.scheduleType==='Pengganti'&&String(s.substitutionDate)===today;const teacherCell='<b>'+esc(t?t.name:s.teacherEmail)+'</b><br><small>'+esc(s.teacherEmail)+'</small>'+(isReplacement?'<div class="replacement-label">🔄 Menggantikan: <b>'+esc((state.data.teachers.find(z=>String(z.email).toLowerCase()===String(s.originalTeacherEmail).toLowerCase())||{}).name||s.originalTeacherEmail)+'</b></div>':'');const typeLabel=isReplacement?'<span class="schedule-type replacement-type">🔄 Pengganti</span>':'<span class="schedule-type regular-type">Reguler</span>';return '<tr'+(isReplacement?' class="replacement-row"':'')+'><td>'+teacherCell+'</td><td>'+esc(s.day)+'</td><td>'+esc(s.startTime)+'–'+esc(s.endTime)+'</td><td>'+esc(s.className)+'</td><td>'+esc(s.topic)+'</td><td>'+esc(s.room)+'<br>'+typeLabel+'</td></tr>';}).join('')+'</tbody></table></div></section></div>';}
function substitutePage(){
const history=(state.data.substitutions||[]).slice().reverse();
return '<div class="content"><section class="page-title"><div><div class="eyebrow">Kolaborasi</div><h1>Guru Pengganti</h1><p>Masukkan jam pelajaran yang Anda tinggalkan, lalu Math Up mencari guru yang tidak bentrok.</p></div></section><section class="card substitute-card"><div class="form-grid"><label>Tanggal<input id="subDate" type="date"></label><label>Jam mulai<input id="subStart" type="time"></label><label>Jam selesai<input id="subEnd" type="time"></label><label>Kelas<input id="subClass" placeholder="Contoh: VIII-A"></label><label>Materi<input id="subTopic" placeholder="Contoh: Persamaan Linear"></label><label>Ruang<input id="subRoom" placeholder="Contoh: R.203"></label><label class="wide">Alasan izin<textarea id="subReason" placeholder="Contoh: Keperluan keluarga"></textarea></label></div><div class="form-actions"><button class="primary" id="findSub">Cari guru pengganti</button></div><div id="candidateArea"></div></section><section class="card" style="margin-bottom:18px"><div class="card-head"><div><h2>Permintaan untuk saya</h2><p>Konfirmasi jika Anda bersedia menjadi guru pengganti.</p></div></div><div class="request-list">'+(state.data.substitutionRequests.length?state.data.substitutionRequests.map(x=>'<div class="request-row"><div><b>'+esc(x.className||'Kelas')+'</b><span>'+esc(x.date)+' · '+esc(x.startTime)+'–'+esc(x.endTime)+' · '+esc(x.reason||'Izin')+'</span></div><div class="request-actions"><button class="secondary respond-sub" data-id="'+esc(x.id)+'" data-action="tolak">Tolak</button><button class="primary respond-sub" data-id="'+esc(x.id)+'" data-action="terima">Terima</button></div></div>').join(''):'<div class="empty-note">Tidak ada permintaan baru.</div>')+'</div></section><section class="card"><div class="card-head"><div><h2>Riwayat pergantian</h2><p>Pengajuan yang tersimpan di Google Sheets.</p></div></div><div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Kelas</th><th>Guru izin</th><th>Pengganti</th><th>Status</th></tr></thead><tbody>'+history.map(x=>{const a=state.data.teachers.find(t=>String(t.email).toLowerCase()===String(x.absentTeacherEmail).toLowerCase());const s=state.data.teachers.find(t=>String(t.email).toLowerCase()===String(x.substituteTeacherEmail).toLowerCase());return '<tr><td>'+esc(x.date)+'<br><small>'+esc(x.startTime)+'–'+esc(x.endTime)+'</small></td><td>'+esc(x.className)+'</td><td>'+esc(a?a.name:x.absentTeacherEmail)+'</td><td>'+esc(s?s.name:x.substituteTeacherEmail)+'</td><td><span class="status-pill">'+esc(x.status)+'</span></td></tr>';}).join('')||'<tr><td colspan="5">Belum ada pengajuan pergantian.</td></tr>'+'</tbody></table></div></section></div>';
}
function todayForSchedule(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function substituteAlerts(){const today=todayForSchedule();const incoming=(state.data.substitutionRequests||[]).filter(x=>String(x.status)==='Diajukan');const approved=(state.data.substitutions||[]).filter(x=>String(x.date)===today&&String(x.status)==='Disetujui');return (incoming.length||approved.length)?'<section class="card alert-card"><div class="card-head"><div><h2>Info pergantian</h2><p>Permintaan dan pergantian yang perlu diperhatikan.</p></div></div>'+(incoming.length?'<div class="alert-item"><b>🔔 '+incoming.length+' permintaan guru pengganti</b><button class="secondary" id="openRequests">Lihat permintaan</button></div>':'')+(approved.length?'<div class="alert-item"><b>🔄 '+approved.length+' jadwal hari ini memiliki guru pengganti</b><button class="secondary" id="openSchedule">Lihat jadwal</button></div>':'')+'</section>':'';}
function defaultSubstituteDate(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function bindSubstitute(){const d=document.getElementById('subDate');if(d&&!d.value)d.value=defaultSubstituteDate();const b=document.getElementById('findSub');if(b)b.onclick=findSubstitute;const o=document.getElementById('openSubstitute');if(o)o.onclick=()=>{state.page='Guru Pengganti';render();};document.querySelectorAll('.respond-sub').forEach(b=>b.onclick=()=>respondSub(b.dataset.id,b.dataset.action));}
async function respondSub(id,action){try{await run('respondSubstitution',[id,action]);alert(action==='terima'?'Pergantian diterima.':'Permintaan ditolak.');await load();state.page='Guru Pengganti';render();}catch(e){alert(e.message||e);}}
async function findSubstitute(){const request={date:document.getElementById('subDate').value,startTime:document.getElementById('subStart').value,endTime:document.getElementById('subEnd').value,className:document.getElementById('subClass').value,topic:document.getElementById('subTopic').value,room:document.getElementById('subRoom').value,reason:document.getElementById('subReason').value};const area=document.getElementById('candidateArea');area.innerHTML='<div class="empty-note">Sedang mengecek jadwal semua guru...</div>';try{const candidates=await run('findSubstituteCandidates',[request]);area.innerHTML='<div class="candidate-head"><h2>Hasil pencarian</h2><span>'+candidates.filter(x=>x.status==='Tersedia').length+' guru tersedia</span></div>'+candidateRows(candidates);bindCandidateButtons(request);}catch(e){area.innerHTML='<div class="error-note">'+esc(e.message||e)+'</div>';}}
function candidateRows(candidates){if(!candidates.length)return '<div class="empty-note">Belum ada guru matematika lain yang terdaftar.</div>';return '<div class="candidate-list">'+candidates.map(c=>'<div class="candidate"><div class="avatar">'+esc((c.name||'?').slice(0,2).toUpperCase())+'</div><div class="candidate-main"><b>'+esc(c.name)+'</b><span>'+esc(c.email)+' · '+esc(c.dailyLoad)+' jam pada hari tersebut</span><small>'+((c.conflicts||[]).length?'Bentrok: '+c.conflicts.map(x=>esc(x.startTime)+'–'+esc(x.endTime)+' '+esc(x.className)).join(', '):(c.agendaConflicts||[]).length?'Ada agenda sekolah pada jam ini.':'Tidak ada jadwal bentrok.')+'</small></div><span class="availability '+(c.status==='Tersedia'?'available':c.status==='Perlu dicek'?'check-status':'unavailable')+'">'+esc(c.status)+'</span>'+(c.status!=='Tidak tersedia'?'<button class="secondary choose-sub" data-email="'+esc(c.email)+'" data-name="'+esc(c.name)+'">Pilih</button>':'')+'</div>').join('')+'</div><div id="selectedSub"></div>';}
function bindCandidateButtons(request){document.querySelectorAll('.choose-sub').forEach(b=>b.onclick=()=>selectSubstitute(b.dataset.email,b.dataset.name,request));}
function selectSubstitute(email,name,request){document.getElementById('selectedSub').innerHTML='<div class="selected-box"><b>'+esc(name)+'</b><span> akan diajukan sebagai guru pengganti.</span><button class="primary" id="confirmSub">Ajukan pergantian</button></div>';document.getElementById('confirmSub').onclick=async()=>{try{await run('saveSubstitution',[{date:request.date,startTime:request.startTime,endTime:request.endTime,className:request.className,topic:request.topic,room:request.room,reason:request.reason,absentTeacherEmail:state.user.email,substituteTeacherEmail:email}]);alert('Pengajuan pergantian tersimpan.');await load();state.page='Guru Pengganti';render();}catch(e){alert(e.message||e);}};}
function calendarPage(){return '<div class="content"><section class="page-title"><div><div class="eyebrow">Sekolah</div><h1>Kalender Akademik</h1><p>Hari libur nasional dan agenda sekolah.</p></div></section><section class="card"><div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Agenda</th><th>Jenis</th><th>Keterangan</th></tr></thead><tbody>'+state.data.academicCalendar.concat(state.data.events).map(e=>'<tr><td>'+esc(e.date||e.eventDate)+'</td><td>'+esc(e.title)+'</td><td>'+esc(e.type||'Sekolah')+'</td><td>'+esc(e.description)+'</td></tr>').join('')+'</tbody></table></div></section></div>';}
function profilePage(){const u=state.user||{};return '<div class="content"><section class="page-title"><div><div class="eyebrow">Akun guru</div><h1>Profil Saya</h1><p>Perbarui identitas dan nomor HP. Email sekolah tidak dapat diubah.</p></div></section><section class="card profile-card"><form id="profileForm"><div class="profile-photo-area"><div class="avatar profile-photo">'+(u.photoUrl?'<img src="'+esc(u.photoUrl)+'" alt="Foto profil">':esc(initials(u.name||u.email||'?')))+'</div><div><b>Foto profil</b><p>JPG, PNG, atau WebP. Maksimal 512 KB.</p><label class="secondary upload-label" for="profilePhotoInput">Pilih foto</label><input id="profilePhotoInput" type="file" accept="image/jpeg,image/png,image/webp" hidden></div></div><label>Nama guru<input id="profileName" maxlength="120" required value="'+esc(u.name||'')+'" placeholder="Nama lengkap"></label><label>Email sekolah<input value="'+esc(u.email||'')+'" disabled readonly></label><label>Nomor HP<input id="profilePhone" maxlength="30" type="tel" value="'+esc(u.phone||'')+'" placeholder="Contoh: 08xxxxxxxxxx"></label><div id="profileMessage" class="form-message" aria-live="polite"></div><div class="form-actions"><button class="primary" id="saveProfile" type="submit">Simpan profil</button></div></form></section></div>';}
function activeTeachersPage(){const teachers=state.data.activeTeachers||[];return '<div class="content"><section class="page-title"><div><div class="eyebrow">Kolaborasi sekolah</div><h1>Daftar Guru Aktif</h1><p>Guru matematika aktif yang terdaftar dengan akun sekolah.</p></div><span class="teacher-count">'+teachers.length+' guru</span></section><section class="card"><div class="table-wrap"><table><thead><tr><th>Nama Guru</th><th>Email Sekolah</th><th>No. HP</th><th>Status</th></tr></thead><tbody>'+teachers.map(t=>'<tr><td><div class="teacher-cell"><span class="avatar">'+esc(initials(t.name||t.email))+'</span><b>'+esc(t.name||'Belum mengisi nama')+'</b></div></td><td>'+esc(t.email)+'</td><td>'+esc(t.phone||'Belum diisi')+'</td><td><span class="status-pill">'+esc(t.status||'Aktif')+'</span></td></tr>').join('')+'</tbody></table></div>'+(teachers.length?'':'<div class="empty-note">Belum ada guru aktif yang terdaftar.</div>')+'</section></div>';}
function updateProfileHeader(){const u=state.user||{};const avatarHtml=u.photoUrl?'<img src="'+esc(u.photoUrl)+'" alt="Foto profil">':esc(initials(u.name||u.email||'?'));document.getElementById('avatar').innerHTML=avatarHtml;document.getElementById('dropdownAvatar').innerHTML=avatarHtml;document.getElementById('userName').textContent=u.name||'Guru';document.getElementById('userEmail').textContent=u.email||'';}
async function saveProfileForm(e){e.preventDefault();const message=document.getElementById('profileMessage'),button=document.getElementById('saveProfile');button.disabled=true;button.textContent='Menyimpan...';message.className='form-message';message.textContent='';try{state.user=await run('saveMyProfile',[{name:document.getElementById('profileName').value,phone:document.getElementById('profilePhone').value}]);updateProfileHeader();message.className='form-message success';message.textContent='Profil berhasil disimpan.';state.data.activeTeachers=await run('getActiveTeachers');}catch(err){message.className='form-message error';message.textContent=err.message||String(err);}finally{button.disabled=false;button.textContent='Simpan profil';}}
async function uploadProfilePhoto(file){const message=document.getElementById('profileMessage');if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)){message.className='form-message error';message.textContent='Pilih foto JPG, PNG, atau WebP.';return;}if(file.size>512*1024){message.className='form-message error';message.textContent='Ukuran foto maksimal 512 KB.';return;}message.className='form-message';message.textContent='Mengunggah foto...';try{const base64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]||'');reader.onerror=()=>reject(new Error('Foto tidak dapat dibaca.'));reader.readAsDataURL(file);});const chunkSize=4500,total=Math.ceil(base64.length/chunkSize),uploadId='rmu_'+Date.now()+'_'+Math.random().toString(36).slice(2,12);let result;for(let i=0;i<total;i++){result=await run('uploadProfilePhotoChunk',[uploadId,i,total,base64.slice(i*chunkSize,(i+1)*chunkSize),file.type]);}state.user=result.user||await run('getCurrentUser');updateProfileHeader();message.className='form-message success';message.textContent='Foto profil berhasil diperbarui.';render();}catch(err){message.className='form-message error';message.textContent=err.message||String(err);}}

function drivePage(){const d=state.data.drive||{configured:false,files:[]};if(!d.configured)return '<div class="content"><section class="page-title"><div><div class="eyebrow">Materi</div><h1>Drive Materi</h1><p>Materi ajar bersama dari folder Google Drive sekolah.</p></div></section><section class="card empty"><div class="empty-icon">▤</div><h1>Folder Drive belum dihubungkan</h1><p>Admin perlu menjalankan setDriveFolderId("ID_FOLDER") sekali di Apps Script.</p></section></div>';const rows=d.files.map(f=>'<div class="drive-row"><div class="drive-icon">▤</div><div class="drive-main"><b>'+esc(f.name)+'</b><span>'+esc(fileTypeLabel(f.mimeType))+' · Diperbarui '+esc(formatDriveDate(f.updatedAt))+'</span></div><a class="secondary" href="'+esc(f.url)+'" target="_blank">Buka</a></div>').join('')||'<div class="empty-note">Folder belum memiliki file.</div>';return '<div class="content"><section class="page-title"><div><div><div class="eyebrow">Materi</div><h1>Drive Materi</h1><p>'+esc(d.folderName)+' · materi ajar bersama untuk guru matematika.</p></div><a class="primary" href="'+esc(d.folderUrl)+'" target="_blank">Buka folder Drive</a></section><section class="card"><div class="card-head"><div><h2>File materi</h2><p>'+d.files.length+' file tersedia</p></div></div><div class="drive-list">'+rows+'</div></section></div>';}
function fileTypeLabel(m){const x=String(m||'');if(x.includes('pdf'))return'PDF';if(x.includes('presentation'))return'Presentasi';if(x.includes('spreadsheet'))return'Spreadsheet';if(x.includes('document'))return'Dokumen';if(x.includes('image'))return'Gambar';if(x.includes('video'))return'Video';return'File';}
function formatDriveDate(v){const d=new Date(v);return isNaN(d)?String(v||''):d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});}
function settingsPage(){return '<div class="content"><section class="page-title"><div><div class="eyebrow">Akun</div><h1>Pengaturan</h1><p>Konfigurasi Math Up dan koneksi Google Sheets.</p></div></section><section class="settings-grid"><section class="card setting"><h2>Akun Google</h2><p>'+esc(state.user.email)+'</p><div class="security">✓ Identitas akun dibaca server Apps Script.</div></section><section class="card setting"><h2>Penyimpanan</h2><p>Data aplikasi disimpan pada Google Sheets yang terhubung ke Apps Script.</p><div class="connection"><span class="status-dot"></span> Terhubung</div></section></section></div>';}
function scheduleModal(){document.getElementById('modalRoot').innerHTML='<div class="modal-backdrop"><div class="modal"><div class="modal-head"><div><h2>Tambah jadwal mengajar</h2><p>Jadwal akan tersimpan atas nama akun Google Anda.</p></div><button class="icon-btn" id="closeSchedule">×</button></div><div class="two"><label>Hari<select id="sDay"><option>Senin</option><option>Selasa</option><option>Rabu</option><option>Kamis</option><option>Jumat</option><option>Sabtu</option></select></label><label>Kelas<input id="sClass" placeholder="Contoh: VIII-A"></label></div><div class="two"><label>Jam mulai<input id="sStart" type="time"></label><label>Jam selesai<input id="sEnd" type="time"></label></div><label>Materi<input id="sTopic" placeholder="Contoh: Persamaan Linear"></label><label>Ruang<input id="sRoom" placeholder="Contoh: R.203"></label><div class="modal-actions"><button class="secondary" id="cancelSchedule">Batal</button><button class="primary" id="saveScheduleBtn">Simpan jadwal</button></div></div></div>';document.getElementById('closeSchedule').onclick=closeModal;document.getElementById('cancelSchedule').onclick=closeModal;document.getElementById('saveScheduleBtn').onclick=async()=>{const item={day:document.getElementById('sDay').value,startTime:document.getElementById('sStart').value,endTime:document.getElementById('sEnd').value,className:document.getElementById('sClass').value.trim(),topic:document.getElementById('sTopic').value.trim(),room:document.getElementById('sRoom').value.trim()};if(!item.startTime||!item.endTime||!item.className){alert('Hari, jam, dan kelas wajib diisi.');return;}if(item.startTime>=item.endTime){alert('Jam selesai harus setelah jam mulai.');return;}try{await run('saveSchedule',[item]);closeModal();await load();state.page='Jadwal Mengajar';render();}catch(e){alert(e.message||e);}};}
function bind(){bindSubstitute();const trigger=document.getElementById('profileTrigger'),dropdown=document.getElementById('profileDropdown');if(trigger&&dropdown){trigger.onclick=e=>{e.stopPropagation();dropdown.hidden=!dropdown.hidden;trigger.setAttribute('aria-expanded',String(!dropdown.hidden));};document.addEventListener('click',e=>{if(!e.target.closest('.profile-wrap')){dropdown.hidden=true;trigger.setAttribute('aria-expanded','false');}});}document.querySelectorAll('#profileDropdown [data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;dropdown.hidden=true;trigger.setAttribute('aria-expanded','false');if(state.page==='Daftar Guru Aktif')run('getActiveTeachers').then(x=>{state.data.activeTeachers=x;render();}).catch(e=>alert(e.message||e));else render();});const pf=document.getElementById('profileForm');if(pf)pf.onsubmit=saveProfileForm;const photo=document.getElementById('profilePhotoInput');if(photo)photo.onchange=()=>uploadProfilePhoto(photo.files&&photo.files[0]);const addSchedule=document.getElementById('addSchedule');if(addSchedule)addSchedule.onclick=scheduleModal;const sd=document.getElementById('scheduleDate');if(sd)sd.onchange=async()=>{try{const date=sd.value;state.scheduleDate=date;const rows=await run('getEffectiveSchedule',[date]);state.data.allSchedule=rows;render();}catch(e){alert(e.message||e);}};const r=document.getElementById('openRequests');if(r)r.onclick=()=>{state.page='Guru Pengganti';render();};const s=document.getElementById('openSchedule');if(s)s.onclick=()=>{state.page='Jadwal Mengajar';render();};document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{await run('toggleTodo',[b.dataset.toggle,!b.textContent.trim()]);await load();});const a=document.getElementById('addTodo');if(a)a.onclick=todoModal;const a2=document.getElementById('addTodo2');if(a2)a2.onclick=todoModal;}
function todoModal(){document.getElementById('modalRoot').innerHTML='<div class="modal-backdrop"><div class="modal"><div class="modal-head"><div><h2>Tugas baru</h2><p>Simpan langsung ke Google Sheets.</p></div><button class="icon-btn" id="close">×</button></div><label>Nama tugas<input id="tTitle" placeholder="Contoh: Siapkan soal STS"></label><label>Deskripsi<textarea id="tDesc" placeholder="Detail tugas"></textarea></label><div class="two"><label>Deadline<input id="tDue" type="datetime-local"></label><label>Prioritas<select id="tPriority"><option>Rendah</option><option selected>Sedang</option><option>Tinggi</option></select></label></div><div class="modal-actions"><button class="secondary" id="close2">Batal</button><button class="primary" id="save">Simpan tugas</button></div></div></div>';document.getElementById('close').onclick=closeModal;document.getElementById('close2').onclick=closeModal;document.getElementById('save').onclick=async()=>{const title=document.getElementById('tTitle').value.trim();if(!title)return;await run('saveTodo',[{title,description:document.getElementById('tDesc').value,dueAt:document.getElementById('tDue').value,priority:document.getElementById('tPriority').value,done:false}]);closeModal();await load();};}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}
async function load(){try{const data=await run('getBootstrap');state.data=data;state.user=await run('getCurrentUser');state.data.substitutionRequests=await run('getSubstitutionRequests');state.data.drive=await run('getDriveMaterials');state.data.activeTeachers=await run('getActiveTeachers');updateProfileHeader();render();}catch(e){document.getElementById('content').innerHTML='<div class="content"><section class="card empty"><h1>Perlu login Google Workspace</h1><p>'+esc(e.message||e)+'</p></section></div>';}}
document.getElementById('search').oninput=e=>{state.query=e.target.value;render();};document.getElementById('refresh').onclick=load;load();
</script>
</body></html>
