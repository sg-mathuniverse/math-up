<!doctype html>
<html lang="id">
<head>
  <base target="_top">
  <?!= include('Styles'); ?>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">∑</div><div><strong>Math Up</strong><span>Teacher Workspace</span></div></div>
    <nav id="nav"></nav>
    <div class="sidebar-bottom">
      <button class="nav" data-page="Pengaturan">⚙️ <span>Pengaturan</span></button>
      <div class="profile-mini"><div class="avatar" id="avatar">GM</div><div><b id="userName">Memuat...</b><span id="userEmail">...</span></div></div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="crumb"><span>Workspace</span><b>/</b><strong id="pageName">Dashboard</strong></div><div class="top-actions"><div class="search">⌕<input id="search" placeholder="Cari tugas..."></div><button class="icon-btn" id="refresh">↻</button></div></header>
    <div id="content"></div>
  </main>
</div>
<div id="modalRoot"></div>
<script>
const pages=['Dashboard','Jadwal Mengajar','To-Do','Kalender Akademik','Drive Materi','Guru Matematika','Pengaturan'];
const state={page:'Dashboard',data:{todos:[],schedule:[],events:[],teachers:[],academicCalendar:[]},user:null,query:''};
const navIcons={'Dashboard':'▦','Jadwal Mengajar':'▣','To-Do':'✓','Kalender Akademik':'□','Drive Materi':'▤','Guru Matematika':'♙'};
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function run(name,args=[]){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(e))[name](...args));}
function renderNav(){document.getElementById('nav').innerHTML=pages.map(p=>'<button class="nav '+(state.page===p?'active':'')+'" data-page="'+p+'"><span>'+ (navIcons[p]||'⚙')+'</span><span>'+p+'</span>'+(p==='To-Do'?'<em>'+state.data.todos.filter(t=>!t.done).length+'</em>':'')+'</button>').join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render();});}
function render(){renderNav();document.getElementById('pageName').textContent=state.page;const c=document.getElementById('content');if(state.page==='Dashboard')c.innerHTML=dashboard();else if(state.page==='To-Do')c.innerHTML=todoPage();else if(state.page==='Jadwal Mengajar')c.innerHTML=schedulePage();else if(state.page==='Kalender Akademik')c.innerHTML=calendarPage();else if(state.page==='Guru Matematika')c.innerHTML=teachersPage();else if(state.page==='Drive Materi')c.innerHTML=drivePage();else c.innerHTML=settingsPage();bind();}
function todoRows(){let q=state.query.toLowerCase();return state.data.todos.filter(t=>String(t.title).toLowerCase().includes(q)).sort((a,b)=>String(a.dueAt).localeCompare(String(b.dueAt))||String(a.priority).localeCompare(String(b.priority))).map(t=>'<div class="todo-row '+(t.done?'done':'')+'"><button class="check" data-toggle="'+esc(t.id)+'">'+(t.done?'✓':'')+'</button><div class="todo-copy"><b>'+esc(t.title)+'</b><span>'+esc(t.description)+'</span><small>◷ '+esc(t.dueAt||'Belum ditentukan')+'</small></div><span class="priority '+String(t.priority).toLowerCase()+'">'+esc(t.priority)+'</span></div>').join('')||'<div class="empty-note">Belum ada tugas.</div>';}
function dashboard(){const active=state.data.todos.filter(t=>!t.done).length;return '<div class="content"><section class="hero"><div><div class="eyebrow">✦ Selamat datang kembali</div><h1>Selamat pagi, Guru! 👋</h1><p>Berikut ringkasan aktivitas matematika Anda.</p></div><button class="primary" id="addTodo">＋ Tambah tugas</button></section><div class="stats"><div class="stat"><div class="stat-icon">▣</div><div><span>Jam mengajar hari ini</span><strong>'+state.data.schedule.length+'</strong><small>Jadwal tersimpan</small></div></div><div class="stat"><div class="stat-icon">✓</div><div><span>Tugas aktif</span><strong>'+active+'</strong><small>Perlu diselesaikan</small></div></div><div class="stat"><div class="stat-icon">□</div><div><span>Agenda akademik</span><strong>'+state.data.events.length+'</strong><small>Agenda bersama</small></div></div></div><div class="grid"><section class="card"><div class="card-head"><div><h2>Jadwal mengajar</h2><p>Data bersama dari Google Sheets</p></div></div><div class="schedule-list">'+scheduleRows()+'</div></section><section class="card"><div class="card-head"><div><h2>To-Do terdekat</h2><p>Deadline lalu prioritas</p></div></div><div class="todo-list">'+todoRows().split('</div>').slice(0,5).join('</div>')+'</div><button class="full-btn" id="addTodo2">＋ Tambah tugas baru</button></section></div></div>';}
function scheduleRows(){return state.data.schedule.slice(0,8).map(s=>'<div class="schedule-row"><div class="time"><b>'+esc(s.startTime)+'</b><span>'+esc(s.endTime)+'</span></div><div class="lesson"><div><b>'+esc(s.className)+'</b><span>'+esc(s.topic)+'</span></div><small>'+esc(s.room)+'</small></div></div>').join('')||'<div class="empty-note">Belum ada jadwal.</div>';}
function todoPage(){return '<div class="content"><section class="page-title"><div><div class="eyebrow">Produktivitas</div><h1>To-Do</h1><p>Kelola pekerjaan mengajar dan deadline.</p></div><button class="primary" id="addTodo">＋ Tambah tugas</button></section><section class="card"><div class="todo-list large">'+todoRows()+'</div></section></div>';}
function schedulePage(){return '<div class="content"><section class="page-title"><div><div class="eyebrow">Kolaborasi</div><h1>Jadwal Mengajar</h1><p>Jadwal guru matematika yang tersimpan di Sheets.</p></div></section><section class="card"><div class="table-wrap"><table><thead><tr><th>Hari</th><th>Jam</th><th>Kelas</th><th>Materi</th><th>Ruang</th></tr></thead><tbody>'+state.data.schedule.map(s=>'<tr><td>'+esc(s.day)+'</td><td>'+esc(s.startTime)+'–'+esc(s.endTime)+'</td><td>'+esc(s.className)+'</td><td>'+esc(s.topic)+'</td><td>'+esc(s.room)+'</td></tr>').join('')+'</tbody></table></div></section></div>';}
function calendarPage(){return '<div class="content"><section class="page-title"><div><div class="eyebrow">Sekolah</div><h1>Kalender Akademik</h1><p>Hari libur nasional dan agenda sekolah.</p></div></section><section class="card"><div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Agenda</th><th>Jenis</th><th>Keterangan</th></tr></thead><tbody>'+state.data.academicCalendar.concat(state.data.events).map(e=>'<tr><td>'+esc(e.date||e.eventDate)+'</td><td>'+esc(e.title)+'</td><td>'+esc(e.type||'Sekolah')+'</td><td>'+esc(e.description)+'</td></tr>').join('')+'</tbody></table></div></section></div>';}
function teachersPage(){return '<div class="content"><section class="page-title"><div><div class="eyebrow">Kolaborasi</div><h1>Guru Matematika</h1><p>Daftar guru yang menggunakan Math Up.</p></div></section><section class="card"><div class="teacher-list">'+state.data.teachers.map(t=>'<div class="teacher"><div class="avatar">'+esc((t.name||'?').slice(0,2).toUpperCase())+'</div><div><b>'+esc(t.name)+'</b><span>'+esc(t.email)+' · '+esc(t.subject)+'</span></div><span class="status">'+esc(t.status)+'</span></div>').join('')+'</div></section></div>';}
function drivePage(){return '<div class="content"><section class="page-title"><div><div class="eyebrow">Materi</div><h1>Drive Materi</h1><p>Tempat ini disiapkan untuk tautan folder Google Drive sekolah.</p></div></section><section class="card empty"><div class="empty-icon">▤</div><h1>Google Drive</h1><p>Integrasi folder Drive akan ditambahkan setelah URL folder sekolah ditentukan.</p></section></div>';}
function settingsPage(){return '<div class="content"><section class="page-title"><div><div class="eyebrow">Akun</div><h1>Pengaturan</h1><p>Konfigurasi Math Up dan koneksi Google Sheets.</p></div></section><section class="settings-grid"><section class="card setting"><h2>Akun Google</h2><p>'+esc(state.user.email)+'</p><div class="security">✓ Identitas akun dibaca server Apps Script.</div></section><section class="card setting"><h2>Penyimpanan</h2><p>Data aplikasi disimpan pada Google Sheets yang terhubung ke Apps Script.</p><div class="connection"><span class="status-dot"></span> Terhubung</div></section></section></div>';}
function bind(){document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{await run('toggleTodo',[b.dataset.toggle,!b.textContent.trim()]);await load();});const a=document.getElementById('addTodo');if(a)a.onclick=todoModal;const a2=document.getElementById('addTodo2');if(a2)a2.onclick=todoModal;}
function todoModal(){document.getElementById('modalRoot').innerHTML='<div class="modal-backdrop"><div class="modal"><div class="modal-head"><div><h2>Tugas baru</h2><p>Simpan langsung ke Google Sheets.</p></div><button class="icon-btn" id="close">×</button></div><label>Nama tugas<input id="tTitle" placeholder="Contoh: Siapkan soal STS"></label><label>Deskripsi<textarea id="tDesc" placeholder="Detail tugas"></textarea></label><div class="two"><label>Deadline<input id="tDue" type="datetime-local"></label><label>Prioritas<select id="tPriority"><option>Rendah</option><option selected>Sedang</option><option>Tinggi</option></select></label></div><div class="modal-actions"><button class="secondary" id="close2">Batal</button><button class="primary" id="save">Simpan tugas</button></div></div></div>';document.getElementById('close').onclick=closeModal;document.getElementById('close2').onclick=closeModal;document.getElementById('save').onclick=async()=>{const title=document.getElementById('tTitle').value.trim();if(!title)return;await run('saveTodo',[{title,description:document.getElementById('tDesc').value,dueAt:document.getElementById('tDue').value,priority:document.getElementById('tPriority').value,done:false}]);closeModal();await load();};}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}
async function load(){try{const data=await run('getBootstrap');state.data=data;state.user=data.user;document.getElementById('userName').textContent=data.user.name;document.getElementById('userEmail').textContent=data.user.email;document.getElementById('avatar').textContent=(data.user.name||'GM').slice(0,2).toUpperCase();render();}catch(e){document.getElementById('content').innerHTML='<div class="content"><section class="card empty"><h1>Perlu login Google Workspace</h1><p>'+esc(e.message||e)+'</p></section></div>';}}
document.getElementById('search').oninput=e=>{state.query=e.target.value;render();};document.getElementById('refresh').onclick=load;load();
</script>
</body></html>
